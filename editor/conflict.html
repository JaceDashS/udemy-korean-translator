<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>충돌 해결</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de;
      --head: #f6f8fa; --accent: #0969da; --pick: #ddf4ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d;
        --head: #161b22; --accent: #4493f8; --pick: #132a44;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d;
      --head: #161b22; --accent: #4493f8; --pick: #132a44;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
      font: 14px/1.45 system-ui, "Malgun Gothic", sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: var(--head); }
    label { display: block; cursor: pointer; border-radius: 4px; padding: 2px 4px; }
    label:has(input:checked) { background: var(--pick); }
    .gone { color: var(--muted); font-style: italic; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    button {
      font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--line); background: var(--head); color: var(--fg);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <h1>같은 단어를 다른 사람도 수정했습니다</h1>
  <p id="intro">단어마다 남길 값을 고르세요. 고른 값으로 등록이 이어집니다.</p>
  <table>
    <thead><tr><th>단어</th><th>내 값</th><th>최신 값 (다른 사람)</th></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="actions">
    <button id="allMine" type="button">모두 내 값</button>
    <button id="allCurrent" type="button">모두 최신 값</button>
    <button id="cancel" type="button">취소</button>
    <button id="done" class="primary" type="button">이대로 등록</button>
  </div>
  <script src="conflict-window.js"></script>
</body>
</html>
