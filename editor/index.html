<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictionary Editor</title>
  <style>
    [hidden] { display: none !important; }
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --head: #f6f8fa;
      --focus: #ddf4ff;
      --accent: #0969da;
      --danger: #cf222e;
      --dup: #fff1e5;
      --ok: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --line: #30363d;
        --head: #161b22;
        --focus: #132a44;
        --accent: #4493f8;
        --danger: #f85149;
        --dup: #3d2b12;
        --ok: #3fb950;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --line: #30363d;
      --head: #161b22;
      --focus: #132a44;
      --accent: #4493f8;
      --danger: #f85149;
      --dup: #3d2b12;
      --ok: #3fb950;
    }
    * { box-sizing: border-box; }
    /* Scrollbars follow the theme colors above (standard properties, Chrome 121+). */
    html, body, .grid-wrap {
      scrollbar-width: thin;
      scrollbar-color: var(--line) var(--head);
    }
    body {
      margin: 0;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 system-ui, "Malgun Gothic", sans-serif;
    }
    h1 { font-size: 18px; margin: 0 12px 0 0; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row + .row { margin-top: 8px; }
    input[type="text"], input[type="search"] {
      font: inherit;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      min-width: 0;
    }
    button {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    .grid-wrap {
      margin-top: 10px;
      overflow: auto;
      max-height: calc(100vh - 200px);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    table { border-collapse: collapse; }
    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--head);
      text-align: left;
      font-weight: 600;
      padding: 6px 8px;
      border: 1px solid var(--line);
      white-space: nowrap;
      user-select: none;
    }
    thead th.sortable { cursor: pointer; }
    thead th.sortable:hover { color: var(--accent); }
    tbody td { border: 1px solid var(--line); padding: 0; }
    tbody td.rownum {
      background: var(--head);
      color: var(--muted);
      text-align: right;
      padding: 0 8px;
      width: 1%;
      white-space: nowrap;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }
    tbody td.check { text-align: center; width: 1%; }
    tbody td.del { width: 1%; }
    td input[type="text"] {
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 6px 8px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    td input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--focus); }
    td input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }
    td button.remove { border: 0; padding: 4px 8px; color: var(--danger); background: transparent; }
    tr.invalid td input[type="text"].word { color: var(--danger); }
    tr.dup td { background: var(--dup); }
    /* Use only the width the content needs. */
    .grid-wrap { width: max-content; max-width: 100%; }
    .add-term { width: fit-content; max-width: 100%; }
    /* Two columns: controls on the left, the term table on the right. */
    .layout { display: flex; flex-direction: column; gap: 12px; }
    .side { display: flex; flex-direction: column; gap: 8px; }
    .side .row + .row { margin-top: 0; }
    .side #search, .side .add-term { width: 100%; max-width: none; }
    .side #newWord, .side #newMeaning { width: 100%; flex: 1 1 100%; }
    .main { min-width: 0; }
    .main .grid-wrap { max-height: calc(100vh - 170px); }
    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .main .grid-wrap { max-height: 60vh; }
    }
    table { width: max-content; }
    td input.word { width: 240px; }
    td input.meaning { width: 300px; }
    #newWord { width: 240px; }
    #newMeaning { width: 300px; }
    .add-term { margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--head); }
    .add-term input[type="text"] { flex: 0 0 auto; }
    .add-term label { display: inline-flex; gap: 4px; align-items: center; }
    .pager select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    .status { min-height: 1.5em; margin-top: 8px; }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }
    .problem { color: var(--danger); }
    .helper.ok { color: var(--ok); }
    .helper.off { color: var(--danger); }
    button.link { border: 0; padding: 0; background: none; color: var(--accent); text-decoration: underline; }
    @media (max-width: 480px) {
      body { padding: 10px; }
      .grid-wrap { max-height: calc(100vh - 260px); }
    }
  </style>
</head>
<body>
  <header class="row">
    <h1>Dictionary Editor</h1>
    <span class="muted">단어 한 행 = 단어 1개. 뜻은 비워둘 수 있습니다(비우면 영어 그대로).</span>
  </header>

  <div class="layout">
  <aside class="side">
  <div class="row">
    <button id="reload" type="button">최신 단어장 받기</button>
    <span class="muted" id="syncInfo"></span>
  </div>
  <div id="loginForm" class="row">
    <button id="login" type="button">사이트 계정으로 로그인</button>
    <span class="muted">Google 등 기존 사이트 로그인 방식을 사용할 수 있습니다.</span>
  </div>
  <div class="row">
    <span id="account"></span><button id="logout" type="button" hidden>로그아웃</button>
    <label><input id="autoUpload" type="checkbox" checked> 자동 업로드</label>
  </div>

  <div class="row">
    <input id="search" type="search" placeholder="검색 (단어 또는 뜻)" autocomplete="off">
    <span class="muted" id="count"></span>
    <span class="problem" id="problems"></span>
  </div>

  <div class="row add-term" role="group" aria-label="단어 추가">
    <input id="newWord" type="text" placeholder="단어 (필수, 예: private subnet)" autocomplete="off">
    <input id="newMeaning" type="text" placeholder="뜻 (선택, 예: 프라이빗 서브넷)" autocomplete="off">
    <label><input id="newExact" type="checkbox"> 대소문자 구분</label>
    <button id="addTerm" class="primary" type="button">추가</button>
  </div>

  <div class="row">
    <button id="register" class="primary" type="button" disabled>지금 업로드</button>
    <span class="muted" id="changes"></span>
  </div>
  <div class="status" id="status" role="status"></div>
  <section aria-labelledby="conflictTitle"><h2 id="conflictTitle">충돌 <span id="conflictCount">0</span>개</h2><div id="conflicts"></div></section>
  <details><summary>로컬에만 유지한 항목</summary><div id="localOnly"></div></details>
  <p class="muted">
    엑셀에서 행을 복사해 단어 칸에 붙여넣으면 여러 행이 한 번에 추가됩니다.
    열 순서는 <b>단어 · 뜻 · 대소문자구분(Y)</b>입니다. Enter는 아래 칸으로 이동합니다.
  </p>
  </aside>

  <section class="main">
  <div class="row pager" aria-label="페이지">
    <button id="firstPage" type="button">«</button>
    <button id="prevPage" type="button">‹ 이전</button>
    <span class="muted" id="pageInfo"></span>
    <button id="nextPage" type="button">다음 ›</button>
    <button id="lastPage" type="button">»</button>
    <label class="muted">페이지당
      <select id="pageSize">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
      </select>
    </label>
  </div>

  <div class="grid-wrap" id="grid">
    <table>
      <thead>
        <tr>
          <th></th>
          <th class="sortable" data-key="word">단어 <span class="arrow"></span></th>
          <th class="sortable" data-key="meaning">뜻 <span class="arrow"></span></th>
          <th class="sortable" data-key="exact">대소문자 구분 <span class="arrow"></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  </section>
  </div>

  <script src="term-files.js"></script>
  <script src="app.js"></script>
</body>
</html>
